    --s-rural: #c58203;
    --s-old: #5d5c57;
    --lf-out: #45443f;
    --accent-bg: #133330;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211;
  --surface-1: #1a1a19;
  --border: #2e2e2b;
  --grid: #2a2a27;
  --hover: rgba(255, 255, 255, 0.06);
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8e8d85;
  --brand-navy: #8fc3e0;
  --logo-navy: #4f86a8;
  --logo-teal: #4f9a9a;
  --org-ink: #f47d73;
  --gold-ink: #f9ae42;
  --teal-ink: #4fc4b5;
  --s-male: #2f89b9;
  --s-female: #e95144;
  --s-urban: #009d8c;
  --s-rural: #c58203;
  --s-old: #5d5c57;
  --lf-out: #45443f;
  --accent-bg: #133330;
}
/* roles built from the four series hues; they follow light/dark automatically */
:root {
  --s-total: var(--s-male);
  --s-new: var(--s-male);
  --s-a1: var(--s-male);
  --s-a2: var(--s-rural);
  --s-a3: var(--s-urban);
  --lf-emp: var(--s-urban);
  --lf-unemp: var(--s-female);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: inherit; }

/* ---------- app shell: sidebar + main ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface-1); border-right: 1px solid var(--border);
  padding: 16px 12px 32px;
}
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; text-decoration: none; }
.sb-brand img { width: 26px; height: auto; display: block; }
.sb-brand b { display: block; font-size: 14px; color: var(--brand-navy); line-height: 1.2; }
.sb-brand span { display: block; font-size: 11.5px; color: var(--text-muted); }
.sb-search {
  width: 100%; font: inherit; font-size: 13px; padding: 7px 10px; margin-bottom: 6px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--text-primary);
}
.sb-search:focus { outline: 2px solid var(--s-urban); outline-offset: -1px; }
.nav-group { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 14px 10px 4px; }
.nav a {
  display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 8px;
  color: var(--text-secondary); text-decoration: none; font-size: 13px; line-height: 1.3;
}
.nav a:hover { background: var(--hover); color: var(--text-primary); }
.nav a.active { background: var(--accent-bg); color: var(--text-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--s-urban); }
.nav .code { flex: none; min-width: 42px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.nav a.active .code { color: var(--teal-ink); }
.nav .empty { padding: 10px; color: var(--text-muted); font-size: 12.5px; }
.scrim { display: none; }
.menu-btn { display: none; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 48px; }

@media (max-width: 960px) {
  .app { display: block; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 30;
    transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 32px rgba(0,0,0,.2);
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .wrap { padding: 16px 16px 40px; }
}

/* ---------- masthead ---------- */
.masthead {
  position: relative; overflow: hidden;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px 22px 18px; margin-bottom: 16px;
}
.masthead::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: linear-gradient(90deg,
    var(--logo-navy) 0 25%, var(--logo-teal) 25% 50%, var(--brand-gold) 50% 75%, var(--logo-red) 75% 100%);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo-tile {
  flex: none; width: 64px; height: 76px; border-radius: 12px; background: #ffffff;
  display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--border);
}
.logo-tile img { width: 46px; height: auto; display: block; }
.org { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--org-ink); }
.org .fr { font-weight: 500; color: var(--text-muted); letter-spacing: 0.02em; }
h1 { font-size: 26px; line-height: 1.15; margin: 3px 0 2px; letter-spacing: -0.015em; color: var(--brand-navy); }
h1 .yr { color: var(--gold-ink); }
.sub { color: var(--text-secondary); font-size: 13px; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); flex-wrap: wrap; }
.seg button {
  font: inherit; font-size: 13px; border: 0; background: none; color: var(--text-secondary);
  padding: 6px 12px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--text-primary); font-weight: 600; }
.ctl-label { color: var(--text-muted); font-size: 12px; }
.icon-btn {
  font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; align-items: center; gap: 6px;
}
[hidden] { display: none !important; }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .k-label { color: var(--text-secondary); font-size: 12px; }
.kpi .k-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.kpi .k-split { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; }
.card h2, .card h3 { font-size: 15px; margin: 0; }
.card .desc { color: var(--text-secondary); font-size: 12.5px; margin-top: 2px; }
.card .src { color: var(--text-muted); font-size: 11.5px; margin-top: 10px; }
.card .src a { color: var(--teal-ink); }
.card-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.link-btn { font: inherit; font-size: 12px; background: none; border: 0; color: var(--text-secondary); text-decoration: underline; cursor: pointer; padding: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-secondary); font-size: 11.5px; }
svg .val { fill: var(--text-primary); font-variant-numeric: tabular-nums; }
svg .axis { stroke: var(--grid); }
.hit { fill: transparent; cursor: default; }
.hit:hover { fill: var(--text-primary); fill-opacity: 0.04; }

table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 6px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; min-width: 180px; }
table.data th { color: var(--text-secondary); font-weight: 600; vertical-align: bottom; white-space: normal; }
table.data tr.hrow td { background: var(--page); color: var(--text-primary); font-weight: 600; text-align: left; }
table.data tr.ind td:first-child { padding-left: 26px; color: var(--text-secondary); }
table.data tr.tot td { font-weight: 650; }
table.data tbody tr:not(.hrow):hover td { background: var(--hover); }
.tbl-wrap { overflow-x: auto; }

#tip {
  position: fixed; pointer-events: none; z-index: 40; opacity: 0; transition: opacity .08s;
  background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  max-width: 280px;
}
#tip .t-title { font-weight: 600; margin-bottom: 4px; }
#tip .t-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
#tip .t-row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
#tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
#tip b { font-variant-numeric: tabular-nums; }

.sel { font: inherit; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 6px; padding: 4px 6px; }

/* ---------- table pages ---------- */
.crumbs { font-size: 12.5px; color: var(--text-muted); margin: 4px 2px 6px; }
.crumbs a { color: var(--text-secondary); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.page-head { margin: 0 2px 14px; }
.page-head h2 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.page-head h2 .tcode { color: var(--teal-ink); margin-right: 8px; }
.page-head p { color: var(--text-secondary); margin: 4px 0 0; max-width: 72ch; }
.stack { display: grid; gap: 16px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.pager a {
  display: block; text-decoration: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
}
.pager a:hover { border-color: var(--s-urban); }
.pager small { display: block; color: var(--text-muted); font-size: 11.5px; }
.pager b { font-size: 13.5px; font-weight: 600; }
.pager .next { text-align: right; grid-column: 2; }

footer { color: var(--text-muted); font-size: 12px; margin-top: 24px; }

@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .k-value { font-size: 21px; }
  h1 { font-size: 21px; }
  .masthead { padding: 18px 16px 14px; }
  .brand { gap: 12px; align-items: flex-start; }
  .logo-tile { width: 48px; height: 58px; border-radius: 10px; }
  .logo-tile img { width: 34px; }
  .org .fr { display: block; }
  .org .dot, .ctl-label { display: none; }
  .controls { gap: 8px; }
  .page-head h2 { font-size: 19px; }
}
</style>
</head>

    const cur = lines[lines.length - 1], next = cur ? cur + " " + w : w;
    if (measure([next]) <= maxW || !cur) lines[lines.length - 1] = next;
    else if (lines.length < 2) lines.push(w);
    else lines[1] += " " + w;
  }
  const last = lines.length - 1;
  if (measure([lines[last]]) > maxW) {
    let l = lines[last];
    while (l.length > 1 && measure([l + "…"]) > maxW) l = l.slice(0, -1);
    lines[last] = l.trimEnd() + "…";
  }
  return lines;
}
function legend(keys) {
  return `<div class="legend">${keys.map(k => `<span><i style="background:${k.color}"></i>${esc(k.name)}</span>`).join("")}</div>`;
}
function table(head, rows) {
  return `<div class="tbl-wrap"><table class="data"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const linkCodes = s => s.replace(/T\d+(\.\d+)?/g, code => {
  const t = TABLES.find(x => x.code === code);
  return t ? `<a href="#${t.id}">${code}</a>` : code;
});

/* ---------- grouped horizontal bar chart ---------- */
function groupedBars(container, { rows, keys, fmt = fmtP, max }) {
  const W = container.clientWidth || 520;
  const valW = 50;
  const LW = Math.min(W * 0.4, measure(rows.map(r => r.label)) + 10);
  const barH = keys.length > 1 ? 9 : 13, gap = 2, groupPad = keys.length > 1 ? 12 : 9, lineH = 13;
  const barsH = keys.length * barH + (keys.length - 1) * gap;
  const layout = rows.map(r => {
    const lines = wrapLabel(r.label, LW - 10);
    return { r, lines, h: Math.max(barsH, lines.length * lineH) };
  });
  const H = layout.reduce((s, g) => s + g.h + groupPad, 0);
  const plotW = W - LW - valW;
  max = max ?? Math.max(1e-9, ...rows.flatMap(r => keys.map(k => r[k.key] ?? 0)));
  const x = v => ((v ?? 0) / max) * plotW;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  el("line", { x1: LW, x2: LW, y1: 0, y2: H - groupPad / 2, class: "axis" }, svg);
  let y0 = groupPad / 2;
  layout.forEach(({ r, lines, h }) => {
    const g = el("g", {}, svg);
    const hit = el("rect", { x: 0, y: y0 - groupPad / 2 + 1, width: W, height: h + groupPad - 2, class: "hit", rx: 4 }, g);
    const t = el("text", { x: LW - 8, y: y0 + h / 2 - (lines.length - 1) * lineH / 2 + 4, "text-anchor": "end" }, g);
    lines.forEach((ln, i) => { const ts = el("tspan", { x: LW - 8, dy: i ? lineH : 0 }, t); ts.textContent = ln; });
    const by = y0 + (h - barsH) / 2;
    keys.forEach((k, j) => {
      const y = by + j * (barH + gap), v = r[k.key];
      el("path", { d: barPath(LW, y, x(v), barH), fill: k.color }, g);
      const vt = el("text", { x: LW + x(v) + 5, y: y + barH - 1.5, class: "val", "font-size": keys.length > 1 ? 10.5 : 11 }, g);
      vt.textContent = fmt(v);
    });
    hit.addEventListener("mousemove", e => showTip(e, r.label, keys.map(k => ({ name: k.name, color: k.color, value: fmt(r[k.key]) }))));
    hit.addEventListener("mouseleave", hideTip);
    y0 += h + groupPad;
  });
  container.appendChild(svg);
}

/* ---------- population pyramid ---------- */
function drawPyramid(c, data) {
  const rows = data.slice().reverse();
  const W = c.clientWidth || 520, mid = W / 2, labW = 44, rowH = 18, H = rows.length * rowH + 4;
  const half = mid - labW / 2 - 38;
  const max = Math.max(...rows.flatMap(r => [r.m, r.f]));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
  rows.forEach((r, i) => {
    const y = i * rowH + 2, h = rowH - 4;
    const wm = r.m / max * half, wf = r.f / max * half;
    el("path", { d: barPathLeft(mid - labW / 2, y, wm, h), fill: COLOR.m }, svg);
    el("path", { d: barPath(mid + labW / 2, y, wf, h), fill: COLOR.f }, svg);
    const t = el("text", { x: mid, y: y + h - 3, "text-anchor": "middle" }, svg); t.textContent = r.age;
    const tm = el("text", { x: mid - labW / 2 - wm - 4, y: y + h - 3, "text-anchor": "end", class: "val", "font-size": 10.5 }, svg); tm.textContent = fmtK(r.m);
    const tf = el("text", { x: mid + labW / 2 + wf + 4, y: y + h - 3, class: "val", "font-size": 10.5 }, svg); tf.textContent = fmtK(r.f);
    const hit = el("rect", { x: 0, y: y - 1, width: W, height: rowH, class: "hit", rx: 4 }, svg);
    hit.addEventListener("mousemove", e => showTip(e, "Age " + r.age, [
      { name: "Male", color: COLOR.m, value: fmtN(r.m) },
      { name: "Female", color: COLOR.f, value: fmtN(r.f) },
      { name: "Total", value: fmtN(r.m + r.f) }]));
    hit.addEventListener("mouseleave", hideTip);
  });
  c.appendChild(svg);
}

/* ---------- labour force status (100% stacked) ---------- */
const LF_PARTS = [
  { key: "employed", name: "Employed", color: "var(--lf-emp)" },
  { key: "unemployed", name: "Unemployed", color: "var(--lf-unemp)" },
  { key: "outside", name: "Outside labour force", color: "var(--lf-out)" },
];
function lfRows() {
  const s = D.lfStatus, find = (reg, sex) => s.find(r => r.region === reg && r.sex === sex);
  const combine = (a, b, label) => ({ label, employed: a.employed + b.employed, unemployed: a.unemployed + b.unemployed, outside: a.outside + b.outside, total: a.total + b.total });
  return [
    combine(find("National", "Male"), find("National", "Female"), "All persons 15+"),
    { ...find("National", "Male"), label: "Male" },
    { ...find("National", "Female"), label: "Female" },
    combine(find("Urban", "Male"), find("Urban", "Female"), "Urban"),
    combine(find("Rural", "Male"), find("Rural", "Female"), "Rural"),
    ...["Urban", "Rural"].flatMap(reg => ["Male", "Female"].map(sex => ({ ...find(reg, sex), label: `${reg} ${sex.toLowerCase()}` }))),
  ];
}
function drawLFStack(c) {
  const shown = lfRows();
  const W = c.clientWidth || 520, LW = measure(shown.map(r => r.label)) + 12, rowH = 30, H = shown.length * rowH;
  const pw = W - LW;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
  shown.forEach((r, i) => {
    const y = i * rowH + 4, h = 20;
    const t = el("text", { x: LW - 8, y: y + 14, "text-anchor": "end" }, svg); t.textContent = r.label;
    let x = LW;
    LF_PARTS.forEach((p, j) => {
      const w = r[p.key] / r.total * pw;
      const isLast = j === LF_PARTS.length - 1;
      el("rect", { x, y, width: Math.max(0, w - (isLast ? 0 : 2)), height: h, fill: p.color, rx: isLast || j === 0 ? 4 : 0 }, svg);
      if (p.key === "employed") { const vt = el("text", { x: x + 6, y: y + 14, style: "fill:#fff;font-weight:600", "font-size": 11 }, svg); vt.textContent = fmtP(r[p.key] / r.total); }
      if (p.key === "outside") { const vt = el("text", { x: W - 6, y: y + 14, "text-anchor": "end", class: "val", "font-size": 11 }, svg); vt.textContent = fmtP(r[p.key] / r.total); }
      x += w;
    });
    const hit = el("rect", { x: 0, y: y - 4, width: W, height: rowH, class: "hit", rx: 4 }, svg);
    hit.addEventListener("mousemove", e => showTip(e, r.label, LF_PARTS.map(p => ({ name: p.name, color: p.color, value: `${fmtP(r[p.key] / r.total)} (${fmtN(r[p.key])})` }))));
    hit.addEventListener("mouseleave", hideTip);
  });
  c.appendChild(svg);
}

/* =====================================================================
   TABLE PAGES (one per table, generated from D.tables)
   ===================================================================== */
const tableState = {}; // per table: { set, section }

function sectionsOf(t) {
  // heading rows split a table into sections; rows above the first heading are the table's headline
  const out = [];
  let cur = null;
  const before = [];
  t.rows.forEach(r => {
    if (r.h) { cur = { name: r.l, rows: [] }; out.push(cur); }
    else if (cur) cur.rows.push(r);
    else before.push(r);
  });
  return out.length ? out : [{ name: "All", rows: before }];
}

function chartRowsFor(t, st) {
  const ch = t.chart, set = ch.sets[st.set];
  const secs = sectionsOf(t);
  const sec = secs[Math.min(st.section, secs.length - 1)];
  const skip = (ch.skip || []).map(s => new RegExp(s, "i"));
  const only = (ch.only || []).map(s => new RegExp(s, "i"));
  // expand: chart a row's indented sub-rows in place of the row itself; otherwise chart top-level rows only
  const base = ch.expand ? sec.rows.filter((r, i, a) => r.i || !(a[i + 1] && a[i + 1].i)) : sec.rows.filter(r => !r.i);
  const rows = base.filter(r => !skip.some(re => re.test(r.l)) && (!only.length || only.some(re => re.test(r.l))));
  const norm = ch.normalize && t.rows.find(r => r.l === ch.normalize);
  const keys = set.series.map((s, i) => ({ key: "s" + i, name: s.n, color: COLOR[s.k], c: s.c }));
  const data = rows.map(r => {
    const o = { label: r.s || r.l };
    keys.forEach(k => { const v = r.v[k.c]; o[k.key] = norm ? (typeof v === "number" ? v / norm.v[k.c] : null) : v; });
    return o;
  });
  if (ch.sort) data.sort((a, b) => keys.reduce((s, k) => s + (b[k.key] || 0) - (a[k.key] || 0), 0));
  const f = norm ? "p" : (rows[0] ? rows[0].f[keys[0].c] : "n");
  return { data, keys, fmt: fmtBy(f), pct: f === "p", sec, secs };
}

function fullTable(t) {
  const n = t.header.length;
  const body = t.rows.map(r => {
    if (r.h) return `<tr class="hrow"><td colspan="${n}">${esc(r.l)}</td></tr>`;
    const cls = [r.i ? "ind" : "", /^total/i.test(r.l) ? "tot" : ""].join(" ").trim();
    const cells = r.v.map((v, i) => `<td>${typeof v === "string" ? esc(v) : fmtBy(r.f[i])(v)}</td>`).join("");
    return `<tr${cls ? ` class="${cls}"` : ""}><td>${esc(r.l)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table class="data"><thead><tr>${t.header.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function downloadCSV(t) {
  const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const lines = [t.header.map(q).join(",")];
  t.rows.forEach(r => lines.push(r.h ? q(r.l) : [r.l, ...r.v].map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t.code}_${t.nav.replace(/[^\w]+/g, "_")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderTable(t) {
  if (!tableState[t.id]) tableState[t.id] = { set: 0, section: 0 };
  const i = TABLES.indexOf(t), prev = TABLES[i - 1], next = TABLES[i + 1];
  $("#view").innerHTML = `
    <div class="crumbs"><a href="#overview">Overview</a> / ${esc(t.group)} / ${esc(t.code)}</div>
    <div class="page-head"><h2><span class="tcode">${esc(t.code)}</span>${esc(t.title)}</h2><p>${esc(t.desc)}</p></div>
    ${t.kpis.length ? `<section class="kpis">${t.kpis.map(k =>
      `<div class="kpi"><div class="k-label">${esc(k.label)}</div><div class="k-value">${fmtBy(k.f)(k.v)}</div></div>`).join("")}</section>` : ""}
    <div class="stack">
      <article class="card" id="tchart"></article>
      <article class="card">
        <div class="card-head">
          <div><h3>Full table</h3><div class="desc">${esc(t.code)} as published · ${t.rows.filter(r => !r.h).length} rows</div></div>
          <div class="card-tools"><button class="icon-btn" id="csv">⤓ Download CSV</button></div>
        </div>
        ${fullTable(t)}
      </article>
    </div>
    <nav class="pager">
      ${prev ? `<a class="prev" href="#${prev.id}"><small>← Previous</small><b>${esc(prev.code)} · ${esc(prev.nav)}</b></a>` : ""}
      ${next ? `<a class="next" href="#${next.id}"><small>Next →</small><b>${esc(next.code)} · ${esc(next.nav)}</b></a>` : ""}
    </nav>`;
  $("#csv").onclick = () => downloadCSV(t);
  drawTableChart(t);
}

function drawTableChart(t) {
  const st = tableState[t.id];
  const root = $("#tchart");
  const kind = t.chart.kind || "bars";
  if (kind === "pyramid") {
    root.innerHTML = `<div class="card-head"><div><h3>Chart</h3><div class="desc">Male to the left, female to the right</div></div></div>${legend([SERIES.m, SERIES.f])}<div class="body"></div>`;
    drawPyramid($(".body", root), t.rows.filter(r => !/^total/i.test(r.l)).map(r => ({ age: r.l, m: r.v[0], f: r.v[1] })));
    return;
  }
  if (kind === "lfstack") {
    root.innerHTML = `<div class="card-head"><div><h3>Chart</h3><div class="desc">Share of the working-age population (15+)</div></div></div>${legend(LF_PARTS)}<div class="body"></div>`;
    drawLFStack($(".body", root));
    return;
  }
  const sets = t.chart.sets;
  const { data, keys, fmt, pct, sec, secs } = chartRowsFor(t, st);
  const setCtl = sets.length < 2 ? "" : sets.length <= 3
    ? `<div class="seg" role="group" aria-label="Compare by">${sets.map((s, i) => `<button data-set="${i}" aria-pressed="${i === st.set}">${esc(s.name)}</button>`).join("")}</div>`
    : `<select class="sel" id="setSel" aria-label="Series">${sets.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("")}</select>`;
  const secCtl = secs.length < 2 ? "" :
    `<select class="sel" id="secSel" aria-label="Breakdown">${secs.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("")}</select>`;
  const unit = t.chart.normalize ? "share of each group" : pct ? "percentages" : "number of persons";
  root.innerHTML = `
    <div class="card-head">
      <div><h3>${secs.length > 1 ? esc(sec.name) : "Chart"}</h3><div class="desc">Values shown as ${unit}</div></div>
      <div class="card-tools">${secCtl}${setCtl}</div>
    </div>
    ${keys.length > 1 ? legend(keys) : ""}
    <div class="body"></div>`;
  const max = pct && t.chart.max ? Math.max(t.chart.max, ...data.flatMap(r => keys.map(k => r[k.key] || 0))) : undefined;
  groupedBars($(".body", root), { rows: data, keys, fmt, max });

  root.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { st.set = +b.dataset.set; drawTableChart(t); });
  const ss = $("#setSel", root); if (ss) { ss.value = st.set; ss.onchange = () => { st.set = +ss.value; drawTableChart(t); }; }
  const sc = $("#secSel", root); if (sc) { sc.value = st.section; sc.onchange = () => { st.section = +sc.value; drawTableChart(t); }; }
}

/* =====================================================================
   SIDEBAR + ROUTING
   ===================================================================== */
function buildNav(filter = "") {
  const q = filter.trim().toLowerCase();
  const match = t => !q || `${t.code} ${t.nav} ${t.title} ${t.group}`.toLowerCase().includes(q);
  let html = q ? "" : `<a href="#overview" data-id="overview"><span class="code">▦</span><span>Overview</span></a>`;
  let count = 0;
  [...new Set(TABLES.map(t => t.group))].forEach(g => {
    const items = TABLES.filter(t => t.group === g && match(t));
    if (!items.length) return;
    count += items.length;
    html += `<div class="nav-group">${esc(g)}</div>` + items.map(t =>
      `<a href="#${t.id}" data-id="${t.id}" title="${esc(t.title)}"><span class="code">${esc(t.code)}</span><span>${esc(t.nav)}</span></a>`).join("");
  });
  if (q && !count) html = `<div class="empty">No tables match “${esc(filter)}”.</div>`;
  $("#nav").innerHTML = html;
  markActive();
}
function currentId() { return location.hash.slice(1) || "overview"; }
function markActive() {
  const id = currentId();
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.id === id));
}

function route() {
  hideTip();
  document.body.classList.remove("nav-open");
  const id = currentId();
  const t = TABLES.find(x => x.id === id);
  document.querySelectorAll(".overview-only").forEach(e => { e.hidden = !!t; });
  if (t) {
    document.title = `${t.code} · ${t.nav} — Vanuatu LFS 2025`;
    renderTable(t);
  } else {
    document.title = "Vanuatu LFS 2025";
    renderOverview();
  }
  markActive();
  const a = $(`#nav a[data-id="${id}"]`);
  if (a) a.scrollIntoView({ block: "nearest" });
}
function rerender() {
  const t = TABLES.find(x => x.id === currentId());
  if (t) drawTableChart(t); else renderOverview(false);
}

/* ---------- wiring ---------- */
$("#sb-logo").src = $("#logo").src;
$("#sb-count").textContent = `${TABLES.length} tables + overview`;
buildNav();
$("#sb-search").addEventListener("input", e => buildNav(e.target.value));
$("#menu").onclick = () => document.body.classList.toggle("nav-open");
$("#scrim").onclick = () => document.body.classList.remove("nav-open");
document.querySelectorAll("#lens button").forEach(b => b.onclick = () => {
  lens = b.dataset.v;
  document.querySelectorAll("#lens button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderOverview(false);
});
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(rerender, 120); });
route();
</script>
</body>
</html>
